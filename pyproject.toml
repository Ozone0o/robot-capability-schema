[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom"
version = "0.1.0"
description = "The open capability contract for robots"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["robotics", "capabilities", "open-standard", "robot-api"]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.scripts]
axiom = "axiom.cli:main"

[tool.setuptools.data-files]
"share/axiom/schema" = ["schema/axiom-1.0.schema.json"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
